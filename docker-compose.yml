services:
  travelbuddy:
    build:
      context: .
      dockerfile: Dockerfile
    image: travelbuddy-app:local
    container_name: travelbuddy_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

