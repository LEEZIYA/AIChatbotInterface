version: '3.8'

services:
  rescue-agent-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: rescue-agent-api
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - USE_MCP=${USE_MCP:-true}
      - USE_MOCK_APIS=${USE_MOCK_APIS:-true}
      - LLM_MODEL=${LLM_MODEL:-gpt-4-turbo-preview}
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
