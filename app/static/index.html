<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOYAGER — AI Travel Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  :root {
    --void: #080c12; --deep: #0d1520; --surface: #111d2e; --panel: #162236;
    --border: #1e3247; --border-hi: #2a4a6a;
    --accent: #00d4ff; --accent2: #00ff9d; --accent3: #ff6b35; --accent4: #ffd166;
    --warn: #ff4757; --text: #c8dff0; --text-dim: #5a7a99; --text-bright: #e8f4ff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--void); color:var(--text); font-family:'DM Sans',sans-serif; height:100vh; overflow:hidden; display:flex; flex-direction:column; }
  body::before { content:''; position:fixed; inset:0; background-image:linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px); background-size:40px 40px; pointer-events:none; z-index:0; }

  /* MARKDOWN STYLES */
  .msg-bubble p { margin:0 0 8px 0; line-height:1.6; }
  .msg-bubble p:last-child { margin-bottom:0; }
  .msg-bubble strong { color:var(--text-bright); font-weight:600; }
  .msg-bubble em { color:var(--accent); font-style:italic; }
  .msg-bubble h3, .msg-bubble h4 { font-size:11px; color:var(--accent); margin:12px 0 6px 0; font-family:'DM Mono',monospace; letter-spacing:1px; text-transform:uppercase; border-bottom:1px solid var(--border); padding-bottom:4px; }
  .msg-bubble ul, .msg-bubble ol { padding-left:18px; margin:6px 0; }
  .msg-bubble li { margin:4px 0; font-size:12px; line-height:1.5; }
  .msg-bubble li strong { color:var(--accent4); }
  .msg-bubble hr { border:none; border-top:1px solid var(--border); margin:10px 0; }
  .msg-bubble code { background:rgba(0,212,255,0.08); border:1px solid var(--border); border-radius:4px; padding:1px 6px; font-family:'DM Mono',monospace; font-size:11px; color:var(--accent); }

  header { position:relative; z-index:10; display:flex; align-items:center; justify-content:space-between; padding:0 24px; height:56px; background:rgba(8,12,18,0.95); border-bottom:1px solid var(--border); backdrop-filter:blur(12px); flex-shrink:0; }
  .logo { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:4px; color:var(--accent); text-shadow:0 0 20px rgba(0,212,255,0.5); }
  .logo span { color:var(--text-dim); font-size:13px; letter-spacing:2px; font-family:'DM Mono',monospace; display:block; margin-top:-4px; }
  .status-pill { display:flex; align-items:center; gap:6px; padding:4px 12px; background:rgba(0,255,157,0.08); border:1px solid rgba(0,255,157,0.2); border-radius:20px; font-size:11px; font-family:'DM Mono',monospace; color:var(--accent2); }
  .status-dot { width:6px; height:6px; border-radius:50%; background:var(--accent2); box-shadow:0 0 8px var(--accent2); animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }

  .app { display:grid; grid-template-columns:260px 1fr 280px; flex:1; overflow:hidden; position:relative; z-index:1; }

  .agents-panel { background:var(--deep); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
  .panel-header { padding:16px 20px 12px; border-bottom:1px solid var(--border); }
  .panel-title { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:2px; color:var(--text-dim); text-transform:uppercase; }
  .agents-list { flex:1; overflow-y:auto; padding:12px; }
  .agents-list::-webkit-scrollbar { width:3px; }
  .agents-list::-webkit-scrollbar-thumb { background:var(--border-hi); }

  .agent-card { padding:12px 14px; border-radius:8px; border:1px solid var(--border); margin-bottom:8px; cursor:pointer; transition:all 0.2s; position:relative; overflow:hidden; }
  .agent-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; border-radius:3px 0 0 3px; background:var(--agent-color,var(--accent)); opacity:0.6; transition:opacity 0.2s; }
  .agent-card:hover, .agent-card.active { background:rgba(255,255,255,0.04); border-color:var(--border-hi); }
  .agent-card.active::before { opacity:1; }
  .agent-card.thinking { border-color:var(--agent-color,var(--accent)); background:rgba(0,212,255,0.04); animation:thinkBorder 1.5s infinite; }
  @keyframes thinkBorder { 0%,100%{box-shadow:0 0 0 0 transparent} 50%{box-shadow:0 0 12px rgba(0,212,255,0.15)} }
  .agent-header { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .agent-icon { width:30px; height:30px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:14px; background:rgba(255,255,255,0.06); border:1px solid var(--border); }
  .agent-name { font-size:12px; font-weight:600; color:var(--text-bright); }
  .agent-role { font-size:10px; color:var(--text-dim); font-family:'DM Mono',monospace; }
  .agent-status-badge { margin-left:auto; font-size:9px; padding:2px 7px; border-radius:10px; font-family:'DM Mono',monospace; background:rgba(255,255,255,0.05); color:var(--text-dim); border:1px solid var(--border); }
  .agent-status-badge.active { background:rgba(0,255,157,0.12); color:var(--accent2); border-color:rgba(0,255,157,0.3); }
  .agent-status-badge.thinking { background:rgba(0,212,255,0.12); color:var(--accent); border-color:rgba(0,212,255,0.3); animation:pulse 1s infinite; }
  .agent-desc { font-size:10px; color:var(--text-dim); line-height:1.5; }

  .chat-area { display:flex; flex-direction:column; overflow:hidden; }
  .chat-topbar { padding:14px 24px; border-bottom:1px solid var(--border); background:rgba(13,21,32,0.8); display:flex; align-items:center; gap:12px; flex-shrink:0; }
  .destination-badge { display:flex; align-items:center; gap:8px; padding:6px 14px; background:rgba(0,212,255,0.08); border:1px solid rgba(0,212,255,0.2); border-radius:6px; font-size:12px; color:var(--accent); font-family:'DM Mono',monospace; }

  .chat-messages { flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:16px; scroll-behavior:smooth; }
  .chat-messages::-webkit-scrollbar { width:4px; }
  .chat-messages::-webkit-scrollbar-thumb { background:var(--border-hi); border-radius:2px; }

  .msg { display:flex; gap:12px; animation:msgIn 0.3s ease; max-width:100%; }
  @keyframes msgIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .msg.user { flex-direction:row-reverse; }
  .msg-avatar { width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; border:1px solid var(--border); }
  .msg-body { max-width:82%; }
  .msg.user .msg-body { align-items:flex-end; display:flex; flex-direction:column; }
  .msg-meta { font-size:10px; color:var(--text-dim); margin-bottom:5px; font-family:'DM Mono',monospace; display:flex; align-items:center; gap:6px; }
  .msg-agent-tag { padding:1px 6px; border-radius:4px; font-size:9px; font-weight:600; letter-spacing:0.5px; }
  .msg-bubble { padding:12px 16px; border-radius:4px 12px 12px 12px; background:var(--panel); border:1px solid var(--border); font-size:13px; line-height:1.6; color:var(--text); position:relative; }
  .msg.user .msg-bubble { background:rgba(0,212,255,0.12); border-color:rgba(0,212,255,0.25); border-radius:12px 4px 12px 12px; color:var(--text-bright); }
  .msg-bubble.orchestrator { border-left:3px solid #00d4ff; }
  .msg-bubble.planner      { border-left:3px solid #00ff9d; }
  .msg-bubble.weather      { border-left:3px solid #ffd166; }
  .msg-bubble.activities   { border-left:3px solid #a78bfa; }
  .msg-bubble.advisory     { border-left:3px solid #ff6b35; }
  .msg-bubble.rescue       { border-left:3px solid #ff4757; }

  /* ADVISORY CARD */
  .advisory-card { margin-top:10px; border-radius:8px; overflow:hidden; border:1px solid var(--border-hi); }
  .advisory-section { padding:12px 14px; border-bottom:1px solid var(--border); }
  .advisory-section:last-child { border-bottom:none; }
  .advisory-section-title { font-size:10px; font-family:'DM Mono',monospace; letter-spacing:1px; text-transform:uppercase; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .risk-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:4px; font-size:11px; font-weight:600; font-family:'DM Mono',monospace; }
  .risk-low      { background:rgba(0,255,157,0.12);  color:#00ff9d; border:1px solid rgba(0,255,157,0.3); }
  .risk-med      { background:rgba(255,209,102,0.12); color:#ffd166; border:1px solid rgba(255,209,102,0.3); }
  .risk-high     { background:rgba(255,107,53,0.12);  color:#ff6b35; border:1px solid rgba(255,107,53,0.3); }
  .risk-critical { background:rgba(255,71,87,0.12);   color:#ff4757; border:1px solid rgba(255,71,87,0.3); }
  .source-stamp { display:flex; align-items:center; gap:6px; margin-top:8px; padding:6px 10px; background:rgba(255,255,255,0.03); border-radius:5px; font-size:10px; font-family:'DM Mono',monospace; color:var(--text-dim); border:1px solid var(--border); }
  .vax-item { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--border); font-size:11px; }
  .vax-item:last-child { border-bottom:none; }
  .req-mandatory   { color:var(--warn);    font-family:'DM Mono',monospace; font-size:10px; }
  .req-recommended { color:var(--accent4); font-family:'DM Mono',monospace; font-size:10px; }
  .req-optional    { color:var(--text-dim);font-family:'DM Mono',monospace; font-size:10px; }
  .rule-item { display:flex; gap:8px; padding:6px 0; font-size:11px; border-bottom:1px solid var(--border); line-height:1.5; }
  .rule-item:last-child { border-bottom:none; }

  /* WEATHER WIDGET */
  .weather-widget { margin-top:10px; display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .weather-cell { padding:10px; background:rgba(255,255,255,0.03); border-radius:8px; border:1px solid var(--border); text-align:center; }
  .weather-day  { font-size:10px; color:var(--text-dim); font-family:'DM Mono',monospace; }
  .weather-icon { font-size:22px; margin:6px 0; }
  .weather-temp { font-size:16px; font-weight:600; color:var(--accent4); }
  .weather-desc { font-size:10px; color:var(--text-dim); }

  /* ITINERARY */
  .itinerary-day { margin-top:8px; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .itin-day-header { padding:8px 14px; background:rgba(0,255,157,0.08); border-bottom:1px solid var(--border); font-size:11px; font-weight:600; color:var(--accent2); font-family:'DM Mono',monospace; }
  .itin-item { padding:8px 14px; border-bottom:1px solid var(--border); display:flex; gap:10px; align-items:flex-start; font-size:12px; }
  .itin-item:last-child { border-bottom:none; }
  .itin-time { font-family:'DM Mono',monospace; font-size:10px; color:var(--text-dim); min-width:50px; margin-top:1px; }

  /* TYPING */
  .typing-indicator { display:flex; gap:12px; align-items:flex-start; }
  .typing-dots { display:flex; gap:4px; padding:12px 16px; background:var(--panel); border:1px solid var(--border); border-radius:4px 12px 12px 12px; align-items:center; }
  .typing-dot { width:6px; height:6px; border-radius:50%; background:var(--text-dim); animation:typingDot 1.2s infinite; }
  .typing-dot:nth-child(2){animation-delay:0.2s} .typing-dot:nth-child(3){animation-delay:0.4s}
  @keyframes typingDot { 0%,60%,100%{transform:translateY(0);opacity:0.4} 30%{transform:translateY(-5px);opacity:1} }

  /* INPUT */
  .chat-input-area { padding:16px 24px; border-top:1px solid var(--border); background:rgba(13,21,32,0.9); flex-shrink:0; }
  .input-row { display:flex; gap:10px; align-items:flex-end; }
  .input-wrap { flex:1; }
  #userInput { width:100%; padding:12px 16px; background:var(--surface); border:1px solid var(--border); border-radius:10px; color:var(--text-bright); font-family:'DM Sans',sans-serif; font-size:13px; outline:none; resize:none; height:46px; transition:border-color 0.2s; }
  #userInput:focus { border-color:rgba(0,212,255,0.4); }
  #userInput::placeholder { color:var(--text-dim); }
  .send-btn { padding:12px 20px; background:var(--accent); color:var(--void); border:none; border-radius:10px; font-size:12px; font-weight:700; font-family:'DM Mono',monospace; letter-spacing:1px; cursor:pointer; transition:all 0.2s; height:46px; }
  .send-btn:hover { background:#33deff; transform:translateY(-1px); }
  .quick-prompts { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .qp-btn { padding:5px 12px; background:transparent; border:1px solid var(--border); border-radius:20px; color:var(--text-dim); font-size:11px; cursor:pointer; transition:all 0.2s; font-family:'DM Sans',sans-serif; }
  .qp-btn:hover { border-color:var(--accent); color:var(--accent); background:rgba(0,212,255,0.05); }

  /* RIGHT PANEL */
  .info-panel { background:var(--deep); border-left:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
  .info-tabs { display:flex; border-bottom:1px solid var(--border); }
  .info-tab { flex:1; padding:12px 8px; text-align:center; font-size:10px; font-family:'DM Mono',monospace; letter-spacing:1px; color:var(--text-dim); cursor:pointer; border-bottom:2px solid transparent; transition:all 0.2s; }
  .info-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
  .info-content { flex:1; overflow-y:auto; padding:16px; }
  .info-content::-webkit-scrollbar { width:3px; }
  .info-content::-webkit-scrollbar-thumb { background:var(--border-hi); }

  .trip-summary { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:12px; }
  .trip-dest { padding:14px; background:linear-gradient(135deg,rgba(0,212,255,0.1),rgba(0,255,157,0.05)); border-bottom:1px solid var(--border); text-align:center; }
  .trip-dest-name { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:3px; color:var(--text-bright); }
  .trip-dest-country { font-size:11px; color:var(--text-dim); font-family:'DM Mono',monospace; letter-spacing:1px; }
  .trip-meta { padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
  .trip-meta-row { display:flex; justify-content:space-between; font-size:11px; align-items:center; }
  .trip-meta-label { color:var(--text-dim); font-family:'DM Mono',monospace; font-size:10px; }
  .trip-meta-val { color:var(--text-bright); font-weight:500; }

  .agent-routing { display:flex; align-items:center; gap:8px; padding:6px 12px; background:rgba(0,212,255,0.06); border:1px solid rgba(0,212,255,0.15); border-radius:6px; font-size:10px; font-family:'DM Mono',monospace; color:var(--text-dim); margin-bottom:4px; }
  .routing-arrow { color:var(--accent); }
  .tag-orchestrator{background:rgba(0,212,255,0.15);color:#00d4ff}
  .tag-planner{background:rgba(0,255,157,0.15);color:#00ff9d}
  .tag-weather{background:rgba(255,209,102,0.15);color:#ffd166}
  .tag-activities{background:rgba(167,139,250,0.15);color:#a78bfa}
  .tag-advisory{background:rgba(255,107,53,0.15);color:#ff6b35}
  .tag-rescue{background:rgba(255,71,87,0.15);color:#ff4757}
  .tag-clarifier{background:rgba(0,212,255,0.15);color:#00d4ff}
</style>
</head>
<body>

<header>
  <div class="logo">VOYAGER<span>AI TRAVEL INTELLIGENCE</span></div>
  <div style="display:flex;align-items:center;gap:20px">
    <div class="status-pill"><div class="status-dot"></div>6 AGENTS ONLINE</div>
    <div style="font-size:11px;font-family:'DM Mono',monospace;color:var(--text-dim)">v3.0.0</div>
  </div>
</header>

<div class="app">
  <!-- LEFT: AGENTS -->
  <div class="agents-panel">
    <div class="panel-header"><div class="panel-title">// AGENT NETWORK</div></div>
    <div class="agents-list" id="agentsList"></div>
  </div>

  <!-- CENTER: CHAT -->
  <div class="chat-area">
    <div class="chat-topbar">
      <div style="font-size:11px;font-family:'DM Mono',monospace;color:var(--text-dim)">ACTIVE SESSION</div>
      <div class="destination-badge" id="destBadge"><span>📍</span><span id="destLabel">No destination set</span></div>
      <button onclick="clearChat()" style="margin-left:auto;padding:5px 12px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text-dim);font-size:11px;cursor:pointer;font-family:'DM Mono',monospace">CLEAR</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <div class="quick-prompts">
        <button class="qp-btn" onclick="sendQuick('Plan a 7-day trip to Japan in April')">🗾 Japan 7-day trip</button>
        <button class="qp-btn" onclick="sendQuick('Is it safe to travel to Bangkok right now?')">🔒 Bangkok safety</button>
        <button class="qp-btn" onclick="sendQuick('What vaccines do I need for Kenya?')">💉 Kenya vaccines</button>
        <button class="qp-btn" onclick="sendQuick('Weather forecast for Paris next week')">🌤 Paris weather</button>
        <button class="qp-btn" onclick="sendQuick('Emergency contacts and hospitals in Dubai')">🚨 Dubai emergency</button>
      </div>
      <div class="input-row">
        <div class="input-wrap">
          <textarea id="userInput" placeholder="Ask anything about your trip..." rows="1" onkeydown="handleKey(event)"></textarea>
        </div>
        <button class="send-btn" onclick="sendMessage()">SEND →</button>
      </div>
    </div>
  </div>

  <!-- RIGHT: INFO -->
  <div class="info-panel">
    <div class="info-tabs">
      <div class="info-tab active" onclick="switchTab('overview',this)">OVERVIEW</div>
      <div class="info-tab" onclick="switchTab('pipeline',this)">PIPELINE</div>
      <div class="info-tab" onclick="switchTab('trip',this)">TRIP</div>
    </div>
    <div class="info-content" id="infoContent"></div>
  </div>
</div>

<script>
// Configure marked.js
if (typeof marked !== 'undefined') {
  marked.setOptions({ breaks: true, gfm: true });
}

function renderMarkdown(text) {
  if (!text) return '';
  if (typeof marked !== 'undefined') {
    return marked.parse(text);
  }
  return text.replace(/\n/g, '<br>');
}

const BACKEND_API = "/api/chat";
let sessionId = null;
let conversationHistory = [];
let currentDestination = '';
let pipelineSteps = [];
let activeTab = 'overview';

const AGENTS = [
  { id:'orchestrator', name:'Orchestrator',     role:'COORDINATION LAYER',    icon:'🎯', color:'#00d4ff', desc:'Routes queries, coordinates all specialist agents.', status:'active' },
  { id:'planner',      name:'Planner Agent',    role:'ITINERARY & LOGISTICS', icon:'🗺️', color:'#00ff9d', desc:'Flights, hotels, day-by-day itineraries.', status:'idle' },
  { id:'weather',      name:'Weather Agent',    role:'METEOROLOGICAL',        icon:'🌤️', color:'#ffd166', desc:'Forecasts, seasonal patterns, packing advice.', status:'idle' },
  { id:'activities',   name:'Activities Agent', role:'EXPERIENCES & CULTURE', icon:'🎭', color:'#a78bfa', desc:'Restaurants, attractions, local experiences.', status:'idle' },
  { id:'advisory',     name:'Advisory Agent',   role:'SAFETY & COMPLIANCE',   icon:'🛡️', color:'#ff6b35', desc:'Safety, visa, vaccines, local laws.', status:'idle' },
  { id:'rescue',       name:'Rescue Agent',     role:'EMERGENCY RESPONSE',    icon:'🚨', color:'#ff4757', desc:'Emergency contacts, hospitals, embassies.', status:'idle' },
];

function hexToRgb(hex) {
  return `${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)}`;
}

function renderAgents() {
  document.getElementById('agentsList').innerHTML = AGENTS.map(a => `
    <div class="agent-card ${a.status==='active'?'active':''}" id="agent-${a.id}" style="--agent-color:${a.color}">
      <div class="agent-header">
        <div class="agent-icon">${a.icon}</div>
        <div><div class="agent-name">${a.name}</div><div class="agent-role">${a.role}</div></div>
        <div class="agent-status-badge ${a.status==='active'?'active':''}" id="badge-${a.id}">${a.status.toUpperCase()}</div>
      </div>
      <div class="agent-desc">${a.desc}</div>
    </div>`).join('');
}

function setAgentStatus(id, status) {
  const card = document.getElementById(`agent-${id}`);
  const badge = document.getElementById(`badge-${id}`);
  if (!card || !badge) return;
  card.className = `agent-card ${status==='thinking'?'thinking':status==='active'?'active':''}`;
  badge.className = `agent-status-badge ${status}`;
  badge.textContent = status.toUpperCase();
  const a = AGENTS.find(x=>x.id===id);
  if (a) card.style.setProperty('--agent-color', a.color);
}

// addMessage — textContent is markdown-rendered, widgetHTML is raw HTML (cards)
function addMessage(agentId, textContent, isUser = false, widgetHTML = '') {
  const container = document.getElementById('chatMessages');
  const agent = AGENTS.find(a=>a.id===agentId) || {name:'You',icon:'👤',color:'#00d4ff',id:'user'};
  const time = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const renderedText = isUser ? textContent : renderMarkdown(textContent);

  const div = document.createElement('div');
  div.className = `msg ${isUser?'user':''}`;
  div.innerHTML = `
    <div class="msg-avatar" style="${!isUser?`background:rgba(${hexToRgb(agent.color)},0.1);border-color:rgba(${hexToRgb(agent.color)},0.3)`:'background:rgba(0,212,255,0.1);border-color:rgba(0,212,255,0.25)'}">
      ${isUser?'👤':agent.icon}
    </div>
    <div class="msg-body ${isUser?'':''}">
      <div class="msg-meta">
        ${!isUser?`<span class="msg-agent-tag tag-${agentId}">${agent.name.toUpperCase()}</span>`:''}
        <span>${time}</span>
      </div>
      <div class="msg-bubble ${isUser?'':agentId}">
        ${renderedText}
        ${widgetHTML}
      </div>
    </div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

function showTyping(agentId) {
  const container = document.getElementById('chatMessages');
  const agent = AGENTS.find(a=>a.id===agentId);
  const div = document.createElement('div');
  div.className = 'typing-indicator'; div.id = 'typing-indicator';
  div.innerHTML = `
    <div class="msg-avatar" style="width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;border:1px solid var(--border);background:rgba(${hexToRgb(agent.color)},0.1)">${agent.icon}</div>
    <div>
      <div class="msg-meta" style="margin-bottom:5px;font-size:10px;color:var(--text-dim);font-family:'DM Mono',monospace">
        <span class="msg-agent-tag tag-${agentId}">${agent.name.toUpperCase()}</span><span>thinking...</span>
      </div>
      <div class="typing-dots"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>
    </div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

// ── WIDGET BUILDERS (return raw HTML, NOT passed through marked) ──────────────

function buildWeatherWidget(forecast) {
  if (!forecast || !Array.isArray(forecast) || forecast.length === 0) return '';
  return `<div class="weather-widget">${forecast.map(f=>`
    <div class="weather-cell">
      <div class="weather-day">${f.day||''}</div>
      <div class="weather-icon">${f.icon||'🌤'}</div>
      <div class="weather-temp">${f.temp||''}</div>
      <div class="weather-desc">${f.desc||''}</div>
    </div>`).join('')}</div>`;
}

function buildItinerary(itinerary) {
  if (!itinerary || !Array.isArray(itinerary) || itinerary.length === 0) return '';
  return itinerary.map(day=>`
    <div class="itinerary-day">
      <div class="itin-day-header">DAY ${day.day}</div>
      ${(day.items||[]).map(item=>`
        <div class="itin-item">
          <div class="itin-time">${item.time||''}</div>
          <div>${item.activity||''}</div>
        </div>`).join('')}
    </div>`).join('');
}

function buildAdvisoryCard(advisory) {
  if (!advisory || !advisory.active) return '';
  const riskClass = {LOW:'risk-low',MEDIUM:'risk-med',HIGH:'risk-high',CRITICAL:'risk-critical'};
  const riskEmoji = {LOW:'🟢',MEDIUM:'🟡',HIGH:'🟠',CRITICAL:'🔴'};
  const rc = riskClass[advisory.risk_level] || 'risk-low';
  const re = riskEmoji[advisory.risk_level]  || '🟢';
  let html = `<div class="advisory-card">`;

  html += `<div class="advisory-section" style="background:rgba(255,107,53,0.05)">
    <div class="advisory-section-title" style="color:#ff6b35">⚡ OVERALL RISK</div>
    <span class="risk-badge ${rc}">${re} ${advisory.risk_level}</span></div>`;

  if (advisory.hazards?.length) {
    html += `<div class="advisory-section"><div class="advisory-section-title" style="color:#ff6b35">⚠️ HAZARDS</div>`;
    advisory.hazards.forEach(h=>{
      const hc = riskClass[h.level]||'risk-low';
      html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:11px;border-bottom:1px solid var(--border)">
        <span style="color:var(--text)">${h.type}: <span style="color:var(--text-dim)">${h.detail}</span></span>
        <span class="risk-badge ${hc}" style="font-size:9px;padding:1px 7px">${h.level}</span></div>`;
    });
    html += `</div>`;
  }

  if (advisory.visa) {
    html += `<div class="advisory-section">
      <div class="advisory-section-title" style="color:#a78bfa">🛂 VISA</div>
      <div style="font-size:12px;margin-bottom:6px"><span style="font-weight:600;color:var(--text-bright)">${advisory.visa.requirement}</span></div>
      <div style="font-size:11px;color:var(--text-dim);margin-bottom:8px">${advisory.visa.details||''}</div>
      <div class="source-stamp"><span style="color:var(--accent)">🏛️</span><span>${advisory.visa.source||''}</span>
        <span style="margin-left:auto;color:var(--accent);font-size:9px">Updated: ${advisory.visa.updated||''}</span></div></div>`;
  }

  if (advisory.vaccines?.length) {
    html += `<div class="advisory-section"><div class="advisory-section-title" style="color:#00ff9d">💉 VACCINES</div>`;
    advisory.vaccines.forEach(v=>{
      const rc2 = v.requirement==='Mandatory'?'req-mandatory':v.requirement==='Recommended'?'req-recommended':'req-optional';
      html += `<div class="vax-item"><span>${v.name}</span>
        <div style="text-align:right"><div class="${rc2}">${v.requirement}</div>
        <div style="font-size:9px;color:var(--text-dim)">${v.notes||''}</div></div></div>`;
    });
    html += `</div>`;
  }

  if (advisory.local_rules?.length) {
    html += `<div class="advisory-section"><div class="advisory-section-title" style="color:#ffd166">📜 LOCAL RULES</div>`;
    advisory.local_rules.forEach(r=>{
      const parts = r.split(' '); const emoji = parts[0]; const text = parts.slice(1).join(' ');
      html += `<div class="rule-item"><span>${emoji}</span><span>${text}</span></div>`;
    });
    html += `</div>`;
  }

  if (advisory.sources?.length) {
    html += `<div class="advisory-section" style="background:rgba(0,212,255,0.03)">
      <div class="advisory-section-title" style="color:var(--text-dim)">📌 SOURCES</div>`;
    advisory.sources.forEach(s=>{
      const icon = s.type==='Government'?'🏛️':s.type==='WHO'?'🏥':'🌐';
      html += `<div class="source-stamp" style="margin-bottom:5px">
        <span style="color:var(--accent)">${icon}</span><span style="color:var(--text)">${s.name}</span>
        <span style="margin-left:4px;padding:1px 6px;background:rgba(0,212,255,0.08);border-radius:3px;font-size:9px;color:var(--accent)">${s.type}</span>
        <span style="margin-left:auto;font-size:9px;color:var(--text-dim)">↻ ${s.updated||''}</span></div>`;
    });
    html += `</div>`;
  }

  html += `</div>`;
  return html;
}

function buildEmergencyWidget(numbers) {
  if (!numbers || !Array.isArray(numbers) || numbers.length === 0) return '';
  return `<div style="margin-top:10px;border:1px solid rgba(255,71,87,0.3);border-radius:8px;overflow:hidden">
    ${numbers.map(e=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px">
        <span style="color:var(--text-dim)">${e.service}</span>
        <span style="font-family:'DM Mono',monospace;color:#ff4757;font-weight:700">${e.number}</span>
      </div>`).join('')}</div>`;
}

function buildHighlightsList(highlights) {
  if (!highlights || !Array.isArray(highlights) || highlights.length === 0) return '';
  return `<ul style="margin-top:8px;padding-left:16px;font-size:12px;color:var(--text-dim)">
    ${highlights.map(h=>`<li style="padding:2px 0">${typeof h==='object'?(h.name||JSON.stringify(h)):h}</li>`).join('')}</ul>`;
}

// ── PIPELINE & OVERVIEW ───────────────────────────────────────────────────────

function updatePipeline(agents) { pipelineSteps = agents; if (activeTab==='pipeline') renderPipeline(); }

function renderPipeline() {
  document.getElementById('infoContent').innerHTML = `
    <div style="font-size:10px;font-family:'DM Mono',monospace;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px">// ACTIVE PIPELINE</div>
    ${AGENTS.map(a=>{
      const on = pipelineSteps.includes(a.id);
      return `<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;font-size:11px;margin-bottom:4px;border:1px solid ${on?`rgba(${hexToRgb(a.color)},0.25)`:'transparent'};background:${on?`rgba(${hexToRgb(a.color)},0.06)`:'transparent'};${!on?'opacity:0.4':''}">
        <span>${a.icon}</span>
        <span style="flex:1;color:${on?a.color:'var(--text)'}">${a.name}</span>
        <span style="color:${on?a.color:'var(--text-dim)'}">${on?'✓':'○'}</span>
      </div>`;}).join('')}
    <div style="margin-top:16px;padding:10px;background:rgba(0,212,255,0.04);border-radius:6px;border:1px solid var(--border)">
      <div style="font-size:10px;font-family:'DM Mono',monospace;color:var(--text-dim);margin-bottom:6px">LAST RUN</div>
      <div style="font-size:11px;color:var(--text)">${pipelineSteps.length} agents</div>
      <div style="font-size:10px;color:var(--text-dim);font-family:'DM Mono',monospace;margin-top:4px">${new Date().toLocaleTimeString()}</div>
    </div>`;
}

function renderOverview() {
  document.getElementById('infoContent').innerHTML = `
    <div class="trip-summary">
      <div class="trip-dest">
        <div class="trip-dest-name">${currentDestination||'NO DESTINATION'}</div>
        <div class="trip-dest-country">${currentDestination?'CURRENT DESTINATION':'SET A DESTINATION TO BEGIN'}</div>
      </div>
      <div class="trip-meta">
        <div class="trip-meta-row"><span class="trip-meta-label">MESSAGES</span><span class="trip-meta-val">${conversationHistory.length}</span></div>
        <div class="trip-meta-row"><span class="trip-meta-label">AGENTS USED</span><span class="trip-meta-val">${pipelineSteps.length}</span></div>
        <div class="trip-meta-row"><span class="trip-meta-label">SESSION</span><span class="trip-meta-val" style="font-size:9px;font-family:'DM Mono',monospace">${sessionId?sessionId.substring(0,8)+'...':'NEW'}</span></div>
      </div>
    </div>
    <div style="font-size:10px;font-family:'DM Mono',monospace;color:var(--text-dim);margin-bottom:10px;margin-top:8px">// AGENT STATUS</div>
    ${AGENTS.map(a=>`
      <div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">
        <span>${a.icon}</span>
        <span style="font-size:11px;color:var(--text);flex:1">${a.name}</span>
        <span style="width:7px;height:7px;border-radius:50%;background:${pipelineSteps.includes(a.id)?a.color:'var(--text-dim)'};box-shadow:${pipelineSteps.includes(a.id)?`0 0 6px ${a.color}`:'none'}"></span>
      </div>`).join('')}`;
}

function switchTab(tab, el) {
  activeTab = tab;
  document.querySelectorAll('.info-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  if (tab==='overview') renderOverview();
  else if (tab==='pipeline') renderPipeline();
  else document.getElementById('infoContent').innerHTML = `<div style="text-align:center;padding:40px 20px;color:var(--text-dim);font-size:12px"><div style="font-size:30px;margin-bottom:12px">🗺️</div><div style="font-family:'DM Mono',monospace">TRIP DATA BUILDS AS YOU CHAT</div></div>`;
}

// ── MAIN SEND ─────────────────────────────────────────────────────────────────

async function sendMessage() {
  const input = document.getElementById('userInput');
  const query = input.value.trim();
  if (!query) return;
  input.value = ''; input.style.height = '46px';

  addMessage('user', query, true);
  conversationHistory.push({role:'user', content:query});

  const involved = ['orchestrator'];
  involved.forEach(id => setAgentStatus(id, 'thinking'));
  showTyping('orchestrator');

  try {
    const response = await fetch(BACKEND_API, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({messages: conversationHistory, session_id: sessionId}),
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || 'Server error');
    if (data.session_id) sessionId = data.session_id;

    removeTyping();
    involved.forEach(id => setAgentStatus(id, 'idle'));

    const parsed = data.result;
    if (!parsed) throw new Error('No result from server');

    // ── Clarification — just show the question, no agent cards ────────────────
    if (data.clarification_needed) {
      const question = data.clarification_question || parsed.orchestrator_message;
      addMessage('orchestrator', question);
      setAgentStatus('orchestrator', 'active');
      conversationHistory.push({role:'assistant', content:question});
      if (activeTab==='overview') renderOverview();
      return;
    }

    // ── Normal response ───────────────────────────────────────────────────────
    if (parsed.destination) {
      currentDestination = parsed.destination;
      document.getElementById('destLabel').textContent = parsed.destination;
    }

    const agentsInvolved = parsed.agents_involved || ['orchestrator'];
    updatePipeline(agentsInvolved);
    agentsInvolved.forEach(id => setAgentStatus(id, 'active'));

    // Routing trail
    if (agentsInvolved.filter(a=>a!=='orchestrator').length > 0) {
      const routingDiv = document.createElement('div');
      routingDiv.innerHTML = `<div class="agent-routing">
        <span>🎯 ORCHESTRATOR</span><span class="routing-arrow">→</span>
        <span>${agentsInvolved.filter(a=>a!=='orchestrator'&&a!=='clarifier').map(a=>{
          const ag=AGENTS.find(x=>x.id===a);
          return ag?`<span style="color:${ag.color}">${ag.icon} ${ag.name}</span>`:'';
        }).join(' + ')}</span>
      </div>`;
      document.getElementById('chatMessages').appendChild(routingDiv.firstChild);
    }

    // Orchestrator summary
    if (parsed.orchestrator_message) {
      addMessage('orchestrator', parsed.orchestrator_message);
    }

    const ar = parsed.agent_responses || {};

    // Weather — text rendered as markdown, widget as raw HTML
    if (ar.weather?.active && ar.weather?.response) {
      const widgetHTML = buildWeatherWidget(ar.weather.forecast);
      addMessage('weather', ar.weather.response, false, widgetHTML);
    }

    // Planner — text rendered as markdown, itinerary as raw HTML
    if (ar.planner?.active && ar.planner?.response) {
      const widgetHTML = buildItinerary(ar.planner.itinerary);
      addMessage('planner', ar.planner.response, false, widgetHTML);
    }

    // Activities — text rendered as markdown, highlights as raw HTML
    if (ar.activities?.active && ar.activities?.response) {
      const widgetHTML = buildHighlightsList(ar.activities.highlights);
      addMessage('activities', ar.activities.response, false, widgetHTML);
    }

    // Advisory — text + structured card (both handled cleanly)
    if (ar.advisory?.active && ar.advisory?.response) {
      const widgetHTML = buildAdvisoryCard(ar.advisory);
      addMessage('advisory', ar.advisory.response, false, widgetHTML);
    }

    // Rescue — text rendered as markdown, emergency numbers as raw HTML
    if (ar.rescue?.active && ar.rescue?.response) {
      const widgetHTML = buildEmergencyWidget(ar.rescue.emergency_numbers);
      addMessage('rescue', ar.rescue.response, false, widgetHTML);
    }

    const assistantSummary = parsed.orchestrator_message || '';
    if (assistantSummary) {
      conversationHistory.push({role:'assistant', content:assistantSummary});
    }

    if (activeTab==='overview') renderOverview();

  } catch (err) {
    removeTyping();
    AGENTS.forEach(a => setAgentStatus(a.id, 'idle'));
    setAgentStatus('orchestrator', 'active');
    console.error('VOYAGER error:', err);
    addMessage('orchestrator', `Something went wrong: ${err.message}. Please try again.`);
  }
}

function sendQuick(text) { document.getElementById('userInput').value = text; sendMessage(); }

function handleKey(e) {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function clearChat() {
  document.getElementById('chatMessages').innerHTML = '';
  conversationHistory = []; currentDestination = ''; pipelineSteps = []; sessionId = null;
  document.getElementById('destLabel').textContent = 'No destination set';
  AGENTS.forEach(a => { a.status='idle'; setAgentStatus(a.id,'idle'); });
  setAgentStatus('orchestrator','active');
  renderOverview(); addWelcomeMessage();
}

function addWelcomeMessage() {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.style.cssText = 'text-align:center;padding:30px 20px;';
  div.innerHTML = `
    <div style="font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:4px;color:var(--accent);text-shadow:0 0 20px rgba(0,212,255,0.3)">VOYAGER</div>
    <div style="font-size:12px;color:var(--text-dim);font-family:'DM Mono',monospace;letter-spacing:2px;margin-top:4px;margin-bottom:20px">AI TRAVEL INTELLIGENCE v3</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;max-width:480px;margin:0 auto 20px">
      ${AGENTS.filter(a=>a.id!=='orchestrator').map(a=>`
        <div style="padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;border-left:3px solid ${a.color}">
          <div style="font-size:18px">${a.icon}</div>
          <div style="font-size:10px;font-weight:600;color:var(--text-bright);margin-top:4px">${a.name}</div>
          <div style="font-size:9px;color:var(--text-dim);font-family:'DM Mono',monospace">${a.role}</div>
        </div>`).join('')}
    </div>
    <div style="font-size:12px;color:var(--text-dim)">Ask me anything about your travel plans ✈️</div>`;
  container.appendChild(div);
}

// INIT
document.getElementById('userInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

renderAgents();
renderOverview();
addWelcomeMessage();
</script>
